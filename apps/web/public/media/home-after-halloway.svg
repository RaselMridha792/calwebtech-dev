  <rect x="28" y="114" width="390" height="12" rx="3" fill="#0a1d37"/>
  <rect x="28" y="136" width="293" height="6" rx="3" fill="#c3cede"/>
  <rect x="28" y="156" width="80" height="24" rx="6" fill="#1550e0"/>
  <rect x="116" y="156" width="80" height="24" rx="6" fill="#dce4ee"/>

