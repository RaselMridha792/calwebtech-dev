# Images are built HERE, never on the VPS. A Next.js build on a 4GB box is the
# known out-of-memory failure this pipeline exists to prevent.
#
# Pull requests run verify and build the images without pushing them.
# Pushes to main also push the images to GHCR, tagged by commit SHA and never latest,
# and, once enabled, deploy that SHA to staging.
# "Run workflow" on the Actions tab deploys production, or staging, at a SHA whose images
# are already in GHCR; nothing is rebuilt. Rollback is the same button with the SHA that
# was live before. The deploy steps themselves live in .github/actions/deploy-over-ssh.
name: release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to deploy
        type: choice
        options: [production, staging]
        default: production
      tag:
        description: Commit SHA whose images were pushed to GHCR from main
        type: string
        required: true

concurrency:
  # Pull request runs on one ref replace each other; pushes to main queue, so a deploy is
  # never cut off. A manual deploy has its own group per stack: it neither waits for nor
  # cancels a pull request or push run, and deploy-manual's own group below serialises it
  # against the automatic staging deploy.
  group: ${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', inputs.stack) || format('release-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # A manual deploy ships images that already passed this on their way to main; it runs
    # no checks and no build.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calwebtech
          POSTGRES_PASSWORD: calwebtech
          POSTGRES_DB: calwebtech
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U calwebtech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://calwebtech:calwebtech@localhost:5432/calwebtech
      REDIS_URL: redis://localhost:6379
      API_INTERNAL_URL: http://localhost:4000
      APP_ORIGIN: http://localhost:3000
      # Cloudflare's documented test keys: the widget always passes and siteverify accepts
      # its dummy token. The API integration tests also exercise the always-fail secret.
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET: 1x0000000000000000000000000000000AA
      # CI has no Resend key and never sends mail.
      EMAIL_TRANSPORT: log
      EMAIL_FROM: Calwebtech <onboarding@resend.dev>
    steps:
      - uses: actions/checkout@v4
      # Version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Type check, lint and build
        run: pnpm build
      - run: pnpm test
      - name: Own client JavaScript per route (20 kB, framework excluded)
        run: pnpm --filter @calwebtech/web budget
      - name: Migrate and seed the CI database, with end-to-end fixtures
        # The seeds run only with APP_ENV=development (packages/db/src/seed/guard.ts). Set here
        # alone, so every other step keeps the unset-means-production path.
        run: pnpm db:deploy && APP_ENV=development pnpm db:seed && APP_ENV=development pnpm db:seed:fixtures
      - name: Integration tests (Postgres, Redis, Turnstile test keys, mocked email transport)
        run: pnpm test:integration
      - name: Lighthouse budget gate
        # The homepage is noindex until homepage.indexing is on, and noindex fails Lighthouse's
        # is-crawlable audit by design. The collector switches indexing on for the run and puts
        # it back afterwards, even when the gate fails (packages/perf/src/collect.mjs), so the
        # end-to-end tests see the noindex homepage.
        run: pnpm lh
        # Five healthy runs through an edge proxy that mirrors infra/traefik/dynamic/edge.yml,
        # with CPU throttling calibrated to this runner. Fails below 90 on any category, or
        # when LCP, CLS, Total Blocking Time (the INP lab proxy) or initial JS breach the
        # budget in CLAUDE.md. Not advisory.
      - name: Install the Playwright browser
        run: pnpm --filter @calwebtech/web exec playwright install --with-deps chromium
      - name: End-to-end tests at 360px and 1440px
        run: pnpm --filter @calwebtech/web e2e
      - name: Keep Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: packages/perf/.lighthouseci
          # The folder name starts with a dot; upload-artifact skips hidden paths by default.
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: apps/web/playwright-report
          if-no-files-found: ignore

  build:
    needs: verify
    # A skipped verify (a manual deploy) must skip the build, never fail it. GitHub already
    # prefixes a job-level if with success(), which a skipped dependency fails; checking
    # the result by name says so without leaning on that.
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - name: Image names (GHCR requires lowercase)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_PREFIX }}-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Build backup
        # Postgres client plus restic, for the ops profile's scheduled backups.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/backup/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_PREFIX }}-backup:${{ github.sha }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

  deploy:
    needs: build
    # Deploys every push to main to staging, automatically. Off until the repository
    # variable DEPLOY_ENABLED is true: switch it on only once the staging environment's
    # secrets exist, or every push to main fails here. The server's side is described in
    # infra/env/staging.env.example and infra/scripts/deploy.sh. Production, and staging at
    # an older SHA, go through deploy-manual below.
    if: github.event_name == 'push' && needs.build.result == 'success' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-over-ssh
        with:
          stack: staging
          tag: ${{ github.sha }}
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          user: ${{ secrets.VPS_USER }}
          ssh-key: ${{ secrets.VPS_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          ghcr-user: ${{ secrets.GHCR_PULL_USER }}
          ghcr-token: ${{ secrets.GHCR_PULL_TOKEN }}

  deploy-manual:
    # "Run workflow" on the Actions tab, with a stack and a commit SHA. Nothing is rebuilt:
    # the images for a SHA were pushed when it landed on main, and there is no needs, so an
    # older SHA deploys as readily as the newest. That is the rollback path. Secrets and
    # the deployment link come from the GitHub environment named after the stack, so
    # production and staging use the same secret names with their own values; required
    # reviewers on the production environment need no change here.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.stack }}
      url: ${{ inputs.stack == 'production' && vars.PRODUCTION_URL || vars.STAGING_URL }}
    concurrency:
      # The same group as the automatic job for staging, so two deploys of one stack never
      # overlap; deploy.sh's rollback assumes it has the stack to itself.
      group: deploy-${{ inputs.stack }}
      cancel-in-progress: false
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Refuse anything but a full commit SHA
        # Images are tagged by the full lowercase SHA. An abbreviated or upper-case one would
        # fail at pull time on the server, after infra/ had already been replaced.
        run: |
          if ! [[ "$TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::tag must be a full 40-character commit SHA, not '$TAG'"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          # The commit itself, so the infra/ copied to the server matches the images. Full
          # history, with every branch, for the ancestry check.
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Refuse a commit that is not on main
        # Images are pushed only from main, so nothing else has any, and an unmerged branch
        # never reaches production by this route.
        run: |
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "::error::$TAG is not on main. Only commits merged to main have images in GHCR."
            exit 1
          fi
      - uses: ./.github/actions/deploy-over-ssh
        with:
          stack: ${{ inputs.stack }}
          tag: ${{ inputs.tag }}
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          user: ${{ secrets.VPS_USER }}
          ssh-key: ${{ secrets.VPS_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          ghcr-user: ${{ secrets.GHCR_PULL_USER }}
          ghcr-token: ${{ secrets.GHCR_PULL_TOKEN }}
