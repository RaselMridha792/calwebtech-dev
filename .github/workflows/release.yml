# Images are built HERE, never on the VPS. A Next.js build on a 4GB box is the
# known out-of-memory failure this pipeline exists to prevent.
#
# Pull requests run verify and build the images without pushing them.
# Pushes to main also push the images to GHCR and, once enabled, deploy.
name: release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calwebtech
          POSTGRES_PASSWORD: calwebtech
          POSTGRES_DB: calwebtech
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U calwebtech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://calwebtech:calwebtech@localhost:5432/calwebtech
      REDIS_URL: redis://localhost:6379
      API_INTERNAL_URL: http://localhost:4000
      APP_ORIGIN: http://localhost:3000
      # Cloudflare's documented test keys: the widget always passes and siteverify accepts
      # its dummy token. The API integration tests also exercise the always-fail secret.
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET: 1x0000000000000000000000000000000AA
      # CI has no Resend key and never sends mail.
      EMAIL_TRANSPORT: log
      EMAIL_FROM: Calwebtech <onboarding@resend.dev>
    steps:
      - uses: actions/checkout@v4
      # Version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Type check, lint and build
        run: pnpm build
      - run: pnpm test
      - name: Own client JavaScript per route (20 kB, framework excluded)
        run: pnpm --filter @calwebtech/web budget
      - name: Migrate and seed the CI database, with end-to-end fixtures
        # The seeds run only with APP_ENV=development (packages/db/src/seed/guard.ts). Set here
        # alone, so every other step keeps the unset-means-production path.
        run: pnpm db:deploy && APP_ENV=development pnpm db:seed && APP_ENV=development pnpm db:seed:fixtures
      - name: Integration tests (Postgres, Redis, Turnstile test keys, mocked email transport)
        run: pnpm test:integration
      - name: Lighthouse budget gate
        # The homepage is noindex until homepage.indexing is on, and noindex fails Lighthouse's
        # is-crawlable audit by design. The collector switches indexing on for the run and puts
        # it back afterwards, even when the gate fails (packages/perf/src/collect.mjs), so the
        # end-to-end tests see the noindex homepage.
        run: pnpm lh
        # Five healthy runs through an edge proxy that mirrors infra/traefik/dynamic/edge.yml,
        # with CPU throttling calibrated to this runner. Fails below 90 on any category, or
        # when LCP, CLS, Total Blocking Time (the INP lab proxy) or initial JS breach the
        # budget in CLAUDE.md. Not advisory.
      - name: Install the Playwright browser
        run: pnpm --filter @calwebtech/web exec playwright install --with-deps chromium
      - name: End-to-end tests at 360px and 1440px
        run: pnpm --filter @calwebtech/web e2e
      - name: Keep Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: packages/perf/.lighthouseci
          # The folder name starts with a dot; upload-artifact skips hidden paths by default.
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: apps/web/playwright-report
          if-no-files-found: ignore

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - name: Image names (GHCR requires lowercase)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_PREFIX }}-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  deploy:
    needs: build
    # Deploys main to staging. Off until the repository variable DEPLOY_ENABLED is true.
    # Switch it on only once the staging environment's secrets exist, or every push to
    # main fails here. The server's side is described in infra/env/staging.env.example
    # and infra/scripts/deploy.sh. Production gets its own manual job once its keys exist.
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Open SSH to the server, with its host key pinned
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::The staging environment has no $name secret"
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host deploy-target\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' \
            "$VPS_HOST" "$VPS_PORT" "$VPS_USER" > ~/.ssh/config
      - name: Copy infra/ for this commit to the server
        run: rsync -az --delete infra/ deploy-target:/srv/calwebtech/infra/
      - name: Let the server pull images from GHCR
        env:
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          # Not needed once the container packages are public.
          if [ -n "$GHCR_PULL_TOKEN" ]; then
            printf '%s' "$GHCR_PULL_TOKEN" | ssh deploy-target docker login ghcr.io -u "$GHCR_PULL_USER" --password-stdin
          fi
      - name: Deploy staging, smoke test, roll back on failure
        run: ssh deploy-target bash /srv/calwebtech/infra/scripts/deploy.sh staging ${{ github.sha }}
