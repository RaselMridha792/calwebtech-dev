# Images are built HERE, never on the VPS. A Next.js build on a 4GB box is the
# known out-of-memory failure this pipeline exists to prevent.
#
# Pull requests run verify and build the images without pushing them.
# Pushes to main also push the images to GHCR and, once enabled, deploy.
name: release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calwebtech
          POSTGRES_PASSWORD: calwebtech
          POSTGRES_DB: calwebtech
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U calwebtech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://calwebtech:calwebtech@localhost:5432/calwebtech
      REDIS_URL: redis://localhost:6379
      API_INTERNAL_URL: http://localhost:4000
      APP_ORIGIN: http://localhost:3000
      # Cloudflare's documented test keys: the widget always passes and siteverify accepts
      # its dummy token. The API integration tests also exercise the always-fail secret.
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET: 1x0000000000000000000000000000000AA
      # CI has no Resend key and never sends mail.
      EMAIL_TRANSPORT: log
      EMAIL_FROM: Calwebtech <onboarding@resend.dev>
    steps:
      - uses: actions/checkout@v4
      # Version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Type check, lint and build
        run: pnpm build
      - run: pnpm test
      - name: Own client JavaScript per route (20 kB, framework excluded)
        run: pnpm --filter @calwebtech/web budget
      - name: Migrate and seed the CI database
        run: pnpm db:deploy && pnpm db:seed
      - name: Integration tests (Postgres, Redis, Turnstile test keys, mocked email transport)
        run: pnpm test:integration
      - name: Lighthouse budget gate
        run: pnpm lh
        # Five healthy runs through an edge proxy that mirrors infra/traefik/dynamic/edge.yml,
        # with CPU throttling calibrated to this runner. Fails below 90 on any category, or
        # when LCP, CLS, Total Blocking Time (the INP lab proxy) or initial JS breach the
        # budget in CLAUDE.md. Not advisory.
      - name: Install the Playwright browser
        run: pnpm --filter @calwebtech/web exec playwright install --with-deps chromium
      - name: End-to-end tests at 360px and 1440px
        run: pnpm --filter @calwebtech/web e2e
      - name: Keep Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: packages/perf/.lighthouseci
          # The folder name starts with a dot; upload-artifact skips hidden paths by default.
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: apps/web/playwright-report
          if-no-files-found: ignore

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - name: Image names (GHCR requires lowercase)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_PREFIX }}-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  deploy:
    needs: build
    # Off until the VPS exists. To enable, set the repository variable
    # DEPLOY_ENABLED=true and the VPS_HOST, VPS_USER and VPS_SSH_KEY secrets.
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Pull, migrate, roll out, smoke test, roll back on failure
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /srv/calwebtech
            COMPOSE="docker compose --env-file .env -f infra/docker-compose.yml"
            PREVIOUS=$(grep '^TAG=' .env | cut -d= -f2 || true)
            # Point at the new images first, so the migration runs from the new code.
            sed -i "s/^TAG=.*/TAG=${{ github.sha }}/" .env
            $COMPOSE pull web api worker
            $COMPOSE run --rm api node dist/migrate.js
            $COMPOSE up -d --wait web api worker
            ./infra/scripts/smoke.sh || {
              echo "smoke failed, rolling back to $PREVIOUS"
              sed -i "s/^TAG=.*/TAG=$PREVIOUS/" .env
              $COMPOSE up -d --wait web api worker
              exit 1
            }
