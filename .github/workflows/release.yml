# Images are built HERE, never on the VPS. A Next.js build on a 4GB box is the
# known out-of-memory failure this pipeline exists to prevent.
name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Lighthouse budget gate
        run: pnpm lh
        # Fails the build below 90 on any category, or if LCP/INP/CLS breach
        # the budget in CLAUDE.md. This gate is not advisory.

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Migrate, roll out, smoke test, rollback on failure
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /srv/calwebtech
            PREVIOUS=$(grep '^TAG=' .env | cut -d= -f2 || echo latest)
            echo "TAG=${{ github.sha }}" > .tag
            # migrations run as a one-off container before the new version starts
            docker compose -f infra/docker-compose.yml run --rm api node dist/migrate.js
            sed -i "s/^TAG=.*/TAG=${{ github.sha }}/" .env
            docker compose -f infra/docker-compose.yml pull web api worker
            docker compose -f infra/docker-compose.yml up -d --wait web api worker
            ./infra/scripts/smoke.sh || {
              echo "smoke failed, rolling back to $PREVIOUS"
              sed -i "s/^TAG=.*/TAG=$PREVIOUS/" .env
              docker compose -f infra/docker-compose.yml up -d --wait web api worker
              exit 1
            }
