packages:
  - apps/*
  - packages/*

# pnpm 10 blocks install scripts by default. Only these may run them.
onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/engines"
  - "@tailwindcss/oxide"
  - esbuild
  - prisma

ignoredBuiltDependencies:
  # Optional native speed-up for BullMQ's msgpackr; the JavaScript fallback is used.
  - msgpackr-extract
  - sharp
  - unrs-resolver
