# Production topology. Only `proxy` publishes host ports; everything else is
# reachable on the internal network alone. Staging runs this same file with a
# different project name, volumes and env file.
name: calwebtech

services:
  proxy:
    image: traefik:v3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      # TLS options and compression live in traefik/dynamic/edge.yml, which the
      # Lighthouse gate's proxy also reads.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks: [edge]

  web:
    image: ${GHCR_IMAGE_WEB}:${TAG:-latest}
    restart: unless-stopped
    env_file: [../.env]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health/"]
      interval: 20s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${PRIMARY_DOMAIN}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=le
      - traefik.http.routers.web.middlewares=edge-compress@file
      - traefik.http.services.web.loadbalancer.server.port=3000
    networks: [edge, internal]
    deploy:
      resources:
        limits: { memory: 1g }

  api:
    image: ${GHCR_IMAGE_API}:${TAG:-latest}
    restart: unless-stopped
    env_file: [../.env]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    # Same origin as the site: https://<domain>/api/* reaches the API with the
    # prefix stripped. No api. subdomain, so session cookies stay first-party
    # (SameSite=Strict) and no CORS is configured. The web app still calls the API
    # directly on the internal network at http://api:4000.
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${PRIMARY_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.routers.api.middlewares=api-strip-prefix,edge-compress@file
      - traefik.http.middlewares.api-strip-prefix.stripprefix.prefixes=/api
      - traefik.http.services.api.loadbalancer.server.port=4000
    networks: [edge, internal]
    deploy:
      resources:
        limits: { memory: 768m }

  worker:
    image: ${GHCR_IMAGE_API}:${TAG:-latest}
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file: [../.env]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 512m }

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]   # never published to the host

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [internal]

  backup:
    image: alpine:3.20
    restart: unless-stopped
    env_file: [../.env]
    volumes:
      - ./scripts:/scripts:ro
      - media:/media:ro
    entrypoint: ["/scripts/backup-entrypoint.sh"]
    depends_on: [db]
    networks: [internal]

  analytics:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_SECRET: ${AUTH_SECRET}
    depends_on:
      db: { condition: service_healthy }
    labels:
      - traefik.enable=true
      - traefik.http.routers.analytics.rule=Host(`analytics.${PRIMARY_DOMAIN}`)
      - traefik.http.routers.analytics.entrypoints=websecure
      - traefik.http.routers.analytics.tls.certresolver=le
      - traefik.http.services.analytics.loadbalancer.server.port=3000
    networks: [edge, internal]

  uptime:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - uptimedata:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.uptime.rule=Host(`status.${PRIMARY_DOMAIN}`)
      - traefik.http.routers.uptime.entrypoints=websecure
      - traefik.http.routers.uptime.tls.certresolver=le
      - traefik.http.services.uptime.loadbalancer.server.port=3001
    networks: [edge, internal]

volumes:
  pgdata:
  redisdata:
  media:
  uptimedata:

networks:
  edge:
  internal:
    internal: true   # no route to the public internet except through the proxy
