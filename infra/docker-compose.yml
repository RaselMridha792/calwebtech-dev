# One application stack: web, api, worker, db and redis.
#
# Production and staging each run this file as their own Compose project, with their own
# env file, database and volumes (Compose namespaces volumes and private networks by
# project). The shared Traefik in infra/proxy routes to each stack by host name.
# infra/scripts/deploy.sh runs both. Local development starts db and redis from this same
# file with docker-compose.dev.yml.
#
#   docker compose -p calwebtech-staging --env-file /srv/calwebtech/env/staging.env \
#     -f infra/docker-compose.yml up -d
#
# Per-stack values come from the env file (infra/env/staging.env.example):
#   STACK             router, middleware and alias prefix: production or staging
#   SITE_HOST         public host name
#   EDGE_MIDDLEWARES  Traefik middlewares in front of the stack (infra/traefik/dynamic)
#   APP_ENV_FILE      the env file every container reads
name: calwebtech

services:
  web:
    image: ${GHCR_IMAGE_WEB:-calwebtech-web}:${TAG:-latest}
    restart: unless-stopped
    env_file: ["${APP_ENV_FILE:-../.env}"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/"]
      interval: 20s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.docker.network=calwebtech-edge
      - traefik.http.routers.${STACK:-local}-web.rule=Host(`${SITE_HOST:-localhost}`)
      - traefik.http.routers.${STACK:-local}-web.entrypoints=websecure
      - traefik.http.routers.${STACK:-local}-web.tls.certresolver=le
      - traefik.http.routers.${STACK:-local}-web.middlewares=${EDGE_MIDDLEWARES:-edge-compress@file}
      - traefik.http.services.${STACK:-local}-web.loadbalancer.server.port=3000
    networks: [edge, internal]
    deploy:
      resources:
        limits: { memory: 1g }

  api:
    image: ${GHCR_IMAGE_API:-calwebtech-api}:${TAG:-latest}
    restart: unless-stopped
    env_file: ["${APP_ENV_FILE:-../.env}"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    # Same origin as the site: https://<SITE_HOST>/api/* reaches the API with the prefix
    # stripped. No api. subdomain, so session cookies stay first-party (SameSite=Strict)
    # and no CORS is configured.
    labels:
      - traefik.enable=true
      - traefik.docker.network=calwebtech-edge
      - traefik.http.routers.${STACK:-local}-api.rule=Host(`${SITE_HOST:-localhost}`) && PathPrefix(`/api`)
      - traefik.http.routers.${STACK:-local}-api.entrypoints=websecure
      - traefik.http.routers.${STACK:-local}-api.tls.certresolver=le
      - traefik.http.routers.${STACK:-local}-api.middlewares=${EDGE_MIDDLEWARES:-edge-compress@file},${STACK:-local}-api-strip
      - traefik.http.middlewares.${STACK:-local}-api-strip.stripprefix.prefixes=/api
      - traefik.http.services.${STACK:-local}-api.loadbalancer.server.port=4000
    networks:
      edge: {}
      internal:
        # Every stack's API sits on the shared edge network, where the name `api` would
        # resolve to more than one stack. Web calls its own API by this alias
        # (API_INTERNAL_URL=http://<STACK>-api:4000).
        aliases: ["${STACK:-local}-api"]
    deploy:
      resources:
        limits: { memory: 768m }

  worker:
    image: ${GHCR_IMAGE_WORKER:-calwebtech-worker}:${TAG:-latest}
    restart: unless-stopped
    env_file: ["${APP_ENV_FILE:-../.env}"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    # `internal` has no route out. `egress` is this stack's own outbound network for the
    # Resend API; it is not the shared edge, so nothing routes in.
    networks: [egress, internal]
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { memory: 512m }

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]   # never published to the host

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # ---- operations (Tasks 6.3 and 6.4). Not started by deploys: the profile is opt-in,
  # started by hand with `--profile ops` once the env file has its backup values. Umami
  # still needs its own database before `analytics` can run.

  # Nightly encrypted off-site backup (docs/01 "Backup and recovery"). The image carries
  # pg_dump at db's major version, restic and the scripts: infra/scripts/backup-entrypoint.sh
  # for the schedule, infra/scripts/restore.sh for the drill. Deploys do not move this
  # service to the new tag; `up -d backup` after a release does.
  backup:
    image: ${GHCR_IMAGE_BACKUP:-calwebtech-backup}:${TAG:-latest}
    profiles: [ops]
    restart: unless-stopped
    env_file: ["${APP_ENV_FILE:-../.env}"]
    volumes:
      - media:/media:ro
    depends_on:
      db: { condition: service_healthy }
    # `internal` reaches db; `egress` reaches the off-site repository, which `internal`
    # cannot (no route out).
    networks: [egress, internal]
    # Unhealthy once the last complete backup is older than 26 hours (the 24-hour RPO plus
    # slack). A new container has that long to make its first backup; RUN_NOW=true makes
    # it immediate.
    healthcheck:
      test: ["CMD", "/scripts/backup-entrypoint.sh", "healthy"]
      interval: 10m
      timeout: 5s
      retries: 3
      start_period: 26h
    deploy:
      resources:
        limits: { memory: 256m }

  analytics:
    image: ghcr.io/umami-software/umami:postgresql-latest
    profiles: [ops]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${UMAMI_DATABASE_URL:-}
      APP_SECRET: ${AUTH_SECRET:-}
    depends_on:
      db: { condition: service_healthy }
    labels:
      - traefik.enable=true
      - traefik.docker.network=calwebtech-edge
      - traefik.http.routers.${STACK:-local}-analytics.rule=Host(`analytics.${SITE_HOST:-localhost}`)
      - traefik.http.routers.${STACK:-local}-analytics.entrypoints=websecure
      - traefik.http.routers.${STACK:-local}-analytics.tls.certresolver=le
      - traefik.http.services.${STACK:-local}-analytics.loadbalancer.server.port=3000
    networks: [edge, internal]

  uptime:
    image: louislam/uptime-kuma:1
    profiles: [ops]
    restart: unless-stopped
    volumes:
      - uptimedata:/app/data
    labels:
      - traefik.enable=true
      - traefik.docker.network=calwebtech-edge
      - traefik.http.routers.${STACK:-local}-uptime.rule=Host(`status.${SITE_HOST:-localhost}`)
      - traefik.http.routers.${STACK:-local}-uptime.entrypoints=websecure
      - traefik.http.routers.${STACK:-local}-uptime.tls.certresolver=le
      - traefik.http.services.${STACK:-local}-uptime.loadbalancer.server.port=3001
    networks: [edge, internal]

volumes:
  pgdata:
  redisdata:
  media:
  uptimedata:

networks:
  # Created by infra/proxy and shared by every stack. Only services Traefik routes to join it.
  edge:
    name: calwebtech-edge
    external: true
  egress: {}
  internal:
    internal: true   # no route to the public internet
