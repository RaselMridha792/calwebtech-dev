# Edge behaviour for every router: TLS and response compression.
#
# The Lighthouse gate's local proxy (packages/perf/src/edge.mjs) reads this file, so
# lab measurements use the same TLS and compression settings as production. If you
# change anything here:
#   1. run the perf package tests; they fail on any setting the proxy cannot mirror;
#   2. re-run `pnpm lh` and, once staging exists, compare with staging
#      (docs/09-performance.md, "Checking the lab against real Traefik").

tls:
  options:
    # "default" applies to every router that does not name another TLS option.
    default:
      minVersion: VersionTLS12
      # TLS 1.2 suites only. TLS 1.3 suites are fixed by Go and cannot be configured.
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
      curvePreferences:
        - X25519
        - CurveP256
      # Traefik's default list, written out so it is reviewed rather than assumed.
      alpnProtocols:
        - h2
        - http/1.1
        - acme-tls/1

http:
  middlewares:
    edge-compress:
      compress:
        # The first entry the client accepts wins.
        encodings:
          - br
          - gzip
        minResponseBodyBytes: 1024
        # Already compressed. Compressing them again costs CPU and saves nothing.
        excludedContentTypes:
          - image/webp
          - image/avif
          - image/jpeg
          - image/png
          - font/woff2
